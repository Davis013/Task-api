<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0c0f; --surface: #111418; --surface2: #161b21;
      --border: #1e2328; --accent: #00d4aa; --accent2: #0099ff;
      --danger: #ff4d6d; --warn: #f59e0b;
      --text: #e8eaed; --muted: #6b7280;
      --font-head: 'Syne', sans-serif; --font-mono: 'DM Mono', monospace;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-mono); overflow-x: hidden; }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #auth-screen::before {
      content: '';
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .auth-logo {
      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }
    .auth-logo span { color: var(--accent); }
    .auth-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 2rem; }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 2rem; border: 1px solid var(--border); }
    .auth-tab {
      flex: 1; padding: 0.6rem; background: transparent;
      border: none; color: var(--muted); font-family: var(--font-mono);
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
    }
    .auth-tab.active { background: var(--accent); color: #000; font-weight: 500; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
    .form-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font-mono); font-size: 0.82rem;
      padding: 0.65rem 0.85rem; outline: none; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; border: none; border-radius: 0;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s; width: 100%;
    }
    .btn-primary { background: var(--accent); color: #000; font-weight: 500; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); width: auto; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 0.4rem 0.75rem; font-size: 0.65rem; }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .error-msg { color: var(--danger); font-size: 0.72rem; margin-top: 0.75rem; min-height: 1rem; }

    /* ── APP SHELL ── */
    #app-screen { display: none; height: 100vh; flex-direction: column; }
    #app-screen.visible { display: flex; }

    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .header-logo { font-family: var(--font-head); font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; }
    .header-logo span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    .header-user { font-size: 0.72rem; color: var(--muted); }
    .header-user strong { color: var(--text); }
    .btn-logout {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.4rem 0.85rem; cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    aside {
      width: 260px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      overflow-y: auto;
    }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); }
    .stat-cell { background: var(--bg); padding: 0.85rem; }
    .stat-label { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
    .stat-value { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; }
    .stat-value.green { color: var(--accent); }
    .stat-value.blue { color: var(--accent2); }
    .stat-value.yellow { color: var(--warn); }

    .filter-section h4 { font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
    .filter-btn {
      display: block; width: 100%; text-align: left;
      background: transparent; border: none; color: var(--muted);
      font-family: var(--font-mono); font-size: 0.75rem; padding: 0.4rem 0.6rem;
      cursor: pointer; transition: color 0.2s; border-left: 2px solid transparent;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { color: var(--accent); border-left-color: var(--accent); }

    /* ── MAIN ── */
    main { flex: 1; overflow-y: auto; padding: 2rem; }
    .main-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .main-title { font-family: var(--font-head); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .btn-add {
      background: var(--accent); color: #000; border: none;
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.6rem 1.25rem; cursor: pointer; font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn-add:hover { opacity: 0.85; }

    /* ── TASK LIST ── */
    #task-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
    .task-card {
      background: var(--surface); padding: 1.1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem; transition: background 0.15s;
    }
    .task-card:hover { background: var(--surface2); }
    .task-priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-high { background: var(--danger); }
    .dot-medium { background: var(--warn); }
    .dot-low { background: var(--accent); }
    .task-info { flex: 1; min-width: 0; }
    .task-title { font-size: 0.88rem; font-weight: 500; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-title.done { text-decoration: line-through; color: var(--muted); }
    .task-meta { font-size: 0.68rem; color: var(--muted); display: flex; gap: 1rem; }
    .task-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .status-badge {
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.2rem 0.6rem; border-radius: 2px;
    }
    .badge-todo { background: rgba(107,114,128,0.15); color: var(--muted); }
    .badge-in_progress { background: rgba(0,153,255,0.12); color: var(--accent2); }
    .badge-done { background: rgba(0,212,170,0.12); color: var(--accent); }

    .empty-state { padding: 4rem 2rem; text-align: center; color: var(--muted); }
    .empty-state p { font-size: 0.82rem; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 200;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      width: 100%; max-width: 480px; padding: 2rem; position: relative;
    }
    .modal::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .modal-title { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: -0.01em; }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font-mono); font-size: 0.82rem;
      padding: 0.65rem 0.85rem; outline: none; transition: border-color 0.2s; appearance: none;
    }
    .form-select:focus { border-color: var(--accent); }
    textarea.form-input { resize: vertical; min-height: 80px; }

    .toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 0.85rem 1.25rem; font-size: 0.78rem;
      z-index: 300; opacity: 0; transform: translateY(8px);
      transition: all 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { border-left-color: var(--danger); }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">Task<span>Flow</span></div>
    <div class="auth-sub">Task Management API — Demo Dashboard</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="login-username" type="text" placeholder="your_username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn btn-primary" onclick="login()">Login</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <!-- Register Form -->
    <div id="register-form" style="display:none;">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="reg-username" type="text" placeholder="your_username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="reg-email" type="email" placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="reg-password" type="password" placeholder="min 6 characters"/>
      </div>
      <button class="btn btn-primary" onclick="register()">Create Account</button>
      <div class="error-msg" id="reg-error"></div>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen">
  <header>
    <div class="header-logo">Task<span>Flow</span></div>
    <div class="header-right">
      <div class="header-user">Logged in as <strong id="header-username"></strong></div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="app-body">
    <aside>
      <div>
        <div class="filter-section" style="margin-bottom:0.5rem;">
          <h4>Overview</h4>
        </div>
        <div class="stats-grid">
          <div class="stat-cell">
            <div class="stat-label">Total</div>
            <div class="stat-value" id="stat-total">0</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">Done</div>
            <div class="stat-value green" id="stat-done">0</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">In Progress</div>
            <div class="stat-value blue" id="stat-inprogress">0</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">High Priority</div>
            <div class="stat-value yellow" id="stat-high">0</div>
          </div>
        </div>
      </div>

      <div class="filter-section">
        <h4>Filter by Status</h4>
        <button class="filter-btn active" onclick="setFilter('status', null, this)">All Tasks</button>
        <button class="filter-btn" onclick="setFilter('status', 'todo', this)">To Do</button>
        <button class="filter-btn" onclick="setFilter('status', 'in_progress', this)">In Progress</button>
        <button class="filter-btn" onclick="setFilter('status', 'done', this)">Done</button>
      </div>

      <div class="filter-section">
        <h4>Filter by Priority</h4>
        <button class="filter-btn" onclick="setFilter('priority', 'high', this)">High</button>
        <button class="filter-btn" onclick="setFilter('priority', 'medium', this)">Medium</button>
        <button class="filter-btn" onclick="setFilter('priority', 'low', this)">Low</button>
      </div>
    </aside>

    <main>
      <div class="main-header">
        <h2 class="main-title" id="main-title">All Tasks</h2>
        <button class="btn-add" onclick="openCreateModal()">+ New Task</button>
      </div>
      <div id="task-list">
        <div class="empty-state"><p>Loading tasks...</p></div>
      </div>
    </main>
  </div>
</div>

<!-- CREATE / EDIT MODAL -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">New Task</div>
    <input type="hidden" id="modal-task-id"/>
    <div class="form-group">
      <label class="form-label">Title *</label>
      <input class="form-input" id="modal-task-title" type="text" placeholder="What needs to be done?"/>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-input" id="modal-task-desc" placeholder="Optional details..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="modal-task-status">
          <option value="todo">To Do</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Priority</label>
        <select class="form-select" id="modal-task-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Due Date (optional)</label>
      <input class="form-input" id="modal-task-due" type="date"/>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="width:auto; padding:0.6rem 1.5rem;" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';
  let token = localStorage.getItem('tf_token') || null;
  let currentUser = JSON.parse(localStorage.getItem('tf_user') || 'null');
  let activeFilters = {};

  // ── INIT ──
  if (token && currentUser) showApp();

  // ── AUTH ──
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (tab === 'login' ? i === 0 : i === 1)));
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  }

  async function login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    err.textContent = '';
    try {
      const res = await fetch(`${API}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error; return; }
      token = data.access_token;
      currentUser = data.user;
      localStorage.setItem('tf_token', token);
      localStorage.setItem('tf_user', JSON.stringify(currentUser));
      showApp();
    } catch { err.textContent = 'Connection error. Is the server running?'; }
  }

  async function register() {
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const err = document.getElementById('reg-error');
    err.textContent = '';
    try {
      const res = await fetch(`${API}/api/auth/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error; return; }
      token = data.access_token;
      currentUser = data.user;
      localStorage.setItem('tf_token', token);
      localStorage.setItem('tf_user', JSON.stringify(currentUser));
      showApp();
    } catch { err.textContent = 'Connection error. Is the server running?'; }
  }

  function logout() {
    token = null; currentUser = null;
    localStorage.removeItem('tf_token');
    localStorage.removeItem('tf_user');
    document.getElementById('app-screen').classList.remove('visible');
    document.getElementById('auth-screen').style.display = 'flex';
  }

  function showApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').classList.add('visible');
    document.getElementById('header-username').textContent = currentUser.username;
    loadTasks();
    loadStats();
  }

  // ── API HELPERS ──
  async function apiFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(options.headers || {}) }
    });
    if (res.status === 401) { logout(); return null; }
    return res;
  }

  // ── TASKS ──
  async function loadTasks() {
    const params = new URLSearchParams(activeFilters);
    const res = await apiFetch(`${API}/api/tasks?${params}`);
    if (!res) return;
    const data = await res.json();
    renderTasks(data.tasks);
  }

  function renderTasks(tasks) {
    const list = document.getElementById('task-list');
    if (!tasks.length) {
      list.innerHTML = '<div class="empty-state"><p>No tasks found. Create one to get started.</p></div>';
      return;
    }
    list.innerHTML = tasks.map(t => `
      <div class="task-card" id="task-${t.id}">
        <div class="task-priority-dot dot-${t.priority}"></div>
        <div class="task-info">
          <div class="task-title ${t.status === 'done' ? 'done' : ''}">${escHtml(t.title)}</div>
          <div class="task-meta">
            <span class="status-badge badge-${t.status}">${t.status.replace('_', ' ')}</span>
            <span>${t.priority} priority</span>
            ${t.due_date ? `<span>Due ${new Date(t.due_date).toLocaleDateString()}</span>` : ''}
          </div>
        </div>
        <div class="task-actions">
          <button class="btn btn-ghost" style="padding:0.35rem 0.7rem;font-size:0.65rem;" onclick="openEditModal(${t.id})">Edit</button>
          <button class="btn btn-danger" onclick="deleteTask(${t.id})">Delete</button>
        </div>
      </div>
    `).join('');
  }

  async function loadStats() {
    const res = await apiFetch(`${API}/api/tasks/stats`);
    if (!res) return;
    const data = await res.json();
    document.getElementById('stat-total').textContent = data.total;
    document.getElementById('stat-done').textContent = data.by_status.done;
    document.getElementById('stat-inprogress').textContent = data.by_status.in_progress;
    document.getElementById('stat-high').textContent = data.by_priority.high;
  }

  async function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    const res = await apiFetch(`${API}/api/tasks/${id}`, { method: 'DELETE' });
    if (res && res.ok) { showToast('Task deleted'); loadTasks(); loadStats(); }
  }

  // ── FILTERS ──
  function setFilter(type, value, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (value) {
      activeFilters[type] = value;
      // clear the other filter type
      if (type === 'status') delete activeFilters.priority;
      else delete activeFilters.status;
    } else {
      activeFilters = {};
    }
    const labels = { null: 'All Tasks', todo: 'To Do', in_progress: 'In Progress', done: 'Done', high: 'High Priority', medium: 'Medium Priority', low: 'Low Priority' };
    document.getElementById('main-title').textContent = labels[value] || 'All Tasks';
    loadTasks();
  }

  // ── MODAL ──
  let editingId = null;

  function openCreateModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'New Task';
    document.getElementById('modal-task-id').value = '';
    document.getElementById('modal-task-title').value = '';
    document.getElementById('modal-task-desc').value = '';
    document.getElementById('modal-task-status').value = 'todo';
    document.getElementById('modal-task-priority').value = 'medium';
    document.getElementById('modal-task-due').value = '';
    document.getElementById('task-modal').classList.add('open');
  }

  async function openEditModal(id) {
    editingId = id;
    const res = await apiFetch(`${API}/api/tasks/${id}`);
    if (!res) return;
    const { task } = await res.json();
    document.getElementById('modal-title').textContent = 'Edit Task';
    document.getElementById('modal-task-title').value = task.title;
    document.getElementById('modal-task-desc').value = task.description || '';
    document.getElementById('modal-task-status').value = task.status;
    document.getElementById('modal-task-priority').value = task.priority;
    document.getElementById('modal-task-due').value = task.due_date ? task.due_date.split('T')[0] : '';
    document.getElementById('task-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('task-modal').classList.remove('open');
  }

  async function saveTask() {
    const title = document.getElementById('modal-task-title').value.trim();
    if (!title) { showToast('Title is required', true); return; }
    const body = {
      title,
      description: document.getElementById('modal-task-desc').value,
      status: document.getElementById('modal-task-status').value,
      priority: document.getElementById('modal-task-priority').value,
      due_date: document.getElementById('modal-task-due').value || null
    };
    const url = editingId ? `${API}/api/tasks/${editingId}` : `${API}/api/tasks`;
    const method = editingId ? 'PUT' : 'POST';
    const res = await apiFetch(url, { method, body: JSON.stringify(body) });
    if (res && res.ok) {
      showToast(editingId ? 'Task updated' : 'Task created');
      closeModal(); loadTasks(); loadStats();
    } else if (res) {
      const d = await res.json();
      showToast(d.error || 'Something went wrong', true);
    }
  }

  // ── UTILS ──
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Close modal on overlay click
  document.getElementById('task-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Enter key on login
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (document.getElementById('login-form').style.display !== 'none') login();
      else if (document.getElementById('register-form').style.display !== 'none') register();
    }
  });
</script>
</body>
</html>
